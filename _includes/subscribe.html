<section class="subband">
  <div class="wrap">
    <div class="inner">
      <h3>{{ T.sub_title }}</h3>
      <p>{{ T.sub_desc }}</p>
      <form class="field" action="{{ site.subscribe_action }}" method="post">
        <input type="email" name="email" placeholder="{{ T.sub_placeholder }}" required>
        <button type="submit">{{ T.sub_button }}</button>
      </form>
    </div>
  </div>
</section>
