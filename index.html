---
layout: default
---
{%- assign list = site.posts | where: "lang", "ko" -%}
<div class="wrap narrow">
  <div class="listwrap">
    <div class="sec-head">
      <h2>최신 기사</h2>
      <a href="{{ '/tags/' | relative_url }}">주제별로 보기 →</a>
    </div>

    {%- if list.size > 0 %}
      {%- for post in list %}
        {%- include post-row.html post=post %}
      {%- endfor %}
    {%- else %}
      <p class="empty">첫 기사를 준비하고 있습니다.<br>곧 새로운 소식으로 찾아뵙겠습니다.</p>
    {%- endif %}
  </div>
</div>
