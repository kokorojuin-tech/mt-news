# ══════════════════════════════════════════════════════════
#  MT News — 사이트 기본 설정
#  이 파일을 수정하면 사이트 전체에 반영됩니다.
# ══════════════════════════════════════════════════════════

title: MT News
tagline: Medical Tourism & Healthcare Industry Report
description: >-
  의료관광과 외국인환자 유치산업, 그리고 관광·의료산업의 국제교류를 기록하는 전문 미디어.

# ▼ 도메인을 연결한 뒤 이 주소를 실제 도메인으로 바꾸세요.
#   (도메인 연결 전이라면 https://아이디.github.io 로 두면 됩니다)
# url: "https://kokorojuin-tech.github.io"
# baseurl: "/mt-news"
url: "https://k-meditour.kr"
baseurl: ""

lang: ko
author: 백승화
email: contact@mtnews.kr

# 뉴스레터 구독 폼 연결 주소 (Formspree / Buttondown / Mailchimp 등)
# 아직 없으면 그대로 두세요. 버튼은 보이지만 전송은 되지 않습니다.
subscribe_action: ""

# ── 카테고리 ───────────────────────────────────────────────
# slug 는 URL 에 쓰이는 영문 이름, name 은 화면에 보이는 이름입니다.
# name_en / name_ja / name_zh 는 영어·일본어·중국어 페이지에서 보이는 이름입니다 (없으면 name 이 그대로 보입니다).
# 글 작성 시 front matter 에 category: policy 처럼 slug 를 씁니다.
# 카테고리를 추가하면 category/ 폴더에 같은 이름의 파일도 만들어야 합니다.
cats:
  - { slug: exchange,      name: "국제교류",      name_en: "International Exchange", name_ja: "国際交流", name_zh: "国际交流" }
  - { slug: column,        name: "칼럼",          name_en: "Column",                 name_ja: "コラム", name_zh: "专栏" }
  - { slug: policy,        name: "정책·제도",     name_en: "Policy & Regulation",    name_ja: "政策・制度", name_zh: "政策·制度" }
  - { slug: stats,         name: "유치실적·통계", name_en: "Statistics",             name_ja: "誘致実績・統計", name_zh: "引进实绩·统计" }
  - { slug: global,        name: "글로벌",        name_en: "Global",                 name_ja: "グローバル", name_zh: "全球" }
  - { slug: medical,       name: "의료산업",      name_en: "Medical Industry",       name_ja: "医療産業", name_zh: "医疗产业" }
  - { slug: tourism,       name: "관광산업",      name_en: "Tourism Industry",       name_ja: "観光産業", name_zh: "旅游产业" }
  - { slug: sports_health, name: "스포츠 건강",   name_en: "Sports & Health",        name_ja: "スポーツ・健康", name_zh: "运动与健康" }
  - { slug: interview,     name: "인터뷰",        name_en: "Interview",              name_ja: "インタビュー", name_zh: "访谈" }
  - { slug: report,        name: "리포트",        name_en: "Report",                 name_ja: "レポート", name_zh: "报告" }

# ── 푸터 링크 ─────────────────────────────────────────────
footer_links:
  - { name: "소개",      name_en: "About",       name_ja: "紹介", name_zh: "关于我们",             url: "/about/" }
  - { name: "기고·제보",  name_en: "Contribute",  name_ja: "寄稿・情報提供", name_zh: "投稿·爆料",     url: "/about/#contact" }
  - { name: "광고문의",   name_en: "Advertising", name_ja: "広告のお問い合わせ", name_zh: "广告咨询", url: "/about/#contact" }
  - { name: "RSS",       name_en: "RSS",         name_ja: "RSS", name_zh: "RSS",              url: "/feed.xml" }

# ── 빌드 설정 (건드리지 않아도 됩니다) ────────────────────────
permalink: /news/:year/:month/:day/:title/
paginate: 8
paginate_path: "/page:num/"
timezone: Asia/Seoul

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      lang: ko

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
